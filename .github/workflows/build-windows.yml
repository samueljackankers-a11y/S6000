Replace:

```cmake
set (S6000_FORMATS AU VST3 Standalone)
```

with:

```cmake
set (S6000_FORMATS VST3 CACHE STRING "S6000 plugin formats")

if (AAX_SDK)
    juce_set_aax_sdk_path (${AAX_SDK})
    list (APPEND S6000_FORMATS AAX)
endif()
```

Then remove the PowerShell section in `build-windows.yml` that edits `CMakeLists.txt`.

Use this configure command instead:

```powershell
cmake -S . -B build -A x64 `
  "-DJUCE_DIR=$env:GITHUB_WORKSPACE/JUCE" `
  "-DS6000_FORMATS=VST3"

if ($LASTEXITCODE -ne 0) {
    throw "CMake configuration failed"
}
```
